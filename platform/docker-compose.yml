services:
  postgres:
    image: postgres:17
    container_name: adotind-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adotind_platform
      POSTGRES_USER: adotind
      POSTGRES_PASSWORD: adotind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: adotind-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

