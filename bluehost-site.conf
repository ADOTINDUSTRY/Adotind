ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    Header always set X-Content-Type-Options "nosniff"

    # GitHub signs this webhook; Coolify verifies the signature before deploying.
    # TLS terminates at the existing public-site proxy, and this hop stays on
    # the private Docker network. No other Coolify routes are exposed here.
    ProxyPassMatch "^(/webhooks/source/github/events/manual)$" "http://coolify:8080$1"
    ProxyPassReverse "/webhooks/source/github/events/manual" "http://coolify:8080/webhooks/source/github/events/manual"

    <Directory /var/www/html>
        Options -Indexes -ExecCGI -Includes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <LocationMatch "(?i)^/(?:app|storage|my-dashboard|platform|svg-trace)(?:/|$)">
        Require all denied
    </LocationMatch>

    <Location "/online-quote/svg-trace/convert">
        php_value upload_max_filesize 8M
        php_value post_max_size 9M
        LimitRequestBody 9437184
    </Location>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
