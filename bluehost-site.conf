ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    Header always set X-Content-Type-Options "nosniff"

    <Directory /var/www/html>
        Options -Indexes -ExecCGI -Includes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <LocationMatch "(?i)^/(?:app|storage|my-dashboard|dashboard|platform|svg-trace)(?:/|$)">
        Require all denied
    </LocationMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
